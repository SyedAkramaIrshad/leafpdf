name: Feature CI probe

on:
  push:
    branches: [feature/next-level-workbench]
    paths-ignore:
      - '.ci/**'

permissions:
  contents: write

jobs:
  verify-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/next-level-workbench
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run all verification gates and record outcomes
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          report=.ci/feature-ci.txt
          : > "$report"
          overall=0

          run_gate() {
            name="$1"
            shift
            echo "===== $name =====" >> "$report"
            "$@" >> "$report" 2>&1
            code=$?
            echo "exit_code=$code" >> "$report"
            echo >> "$report"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }

          run_gate npm-ci npm ci
          run_gate lint npm run lint
          run_gate unit npm test
          run_gate build npm run build
          run_gate python-dependencies pip install reportlab pypdf
          run_gate poppler bash -lc 'sudo apt-get update && sudo apt-get install -y poppler-utils'
          run_gate fixtures bash -lc 'python3 scripts/create-fixture.py && python3 scripts/create-edge-fixtures.py && python3 scripts/test_verify_export.py'
          run_gate playwright-install npx playwright install --with-deps chromium
          run_gate e2e-development npm run test:e2e
          echo "===== e2e-production =====" >> "$report"
          LEAFPDF_E2E_SERVER=preview npm run test:e2e >> "$report" 2>&1
          code=$?
          echo "exit_code=$code" >> "$report"
          if [ "$code" -ne 0 ]; then overall=1; fi

          echo "overall_exit_code=$overall" >> "$report"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit verification report
        run: |
          git config user.name 'LeafPDF CI probe'
          git config user.email 'actions@users.noreply.github.com'
          git add -- .ci/feature-ci.txt
          git commit -m 'Record feature branch verification results' || exit 0
          git push origin HEAD:feature/next-level-workbench
      - name: Fail when any gate failed
        if: steps.verify.outputs.overall != '0'
        run: exit 1
