name: LeafPDF visual preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm ci

      - name: Build deterministic PDF fixtures
        run: |
          pip install reportlab pypdf
          python3 scripts/create-fixture.py
          python3 scripts/create-edge-fixtures.py

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/leafpdf-preview.log 2>&1 &
          echo $! > /tmp/leafpdf-preview.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/leafpdf-preview.log
          exit 1

      - name: Capture desktop states
        run: node scripts/capture-preview.mjs

      - name: Upload rendered preview and production build
        uses: actions/upload-artifact@v4
        with:
          name: leafpdf-visual-preview
          path: |
            preview
            dist
          if-no-files-found: error
          retention-days: 7
