name: Feature branch CI

on:
  push:
    branches: [feature/next-level-workbench]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install reportlab pypdf
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 scripts/create-fixture.py
      - run: python3 scripts/create-edge-fixtures.py
      - run: python3 scripts/test_verify_export.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e
        env:
          LEAFPDF_E2E_SERVER: preview
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: feature-branch-playwright-traces
          path: test-results/
          retention-days: 7
